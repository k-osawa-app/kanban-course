    <div class="board-header">
    <!-- <h2>Board</h2> -->
      <button (click)="isModalOpen.set(true)">+ タスク追加</button>    
    <!-- モーダル (簡易実装) -->
    </div>
  
    @if(isModalOpen()){
      <div class="modal-overlay">
       <div class="modal-content">
        <h3>新しいタスク</h3>
        <app-task-form 
          (submitTask)="onTaskCreate($event)"
          (cancel)="isModalOpen.set(false)">
        </app-task-form>
       </div>
      </div>
      } 
  
  <!-- @if( tasksSignal().length >0 ){                 -->
    <div class="toolbar">        
        <label>
          <input type="checkbox" 
            [checked]="onlyMyTasks()" 
            (change)="toggleFilter($event)" />
          自分のみ表示
    </label>
      </div>  
       <!-- カンバンボードエリア -->
    <!-- cdkDropListGroup: 複数のリスト間でドラッグ移動可能にするグループ化 -->
    <div class="kanban-board" cdkDropListGroup>     
      @for(status of statuses; track status){
        <div class="column" >
            <h3>{{ status | uppercase }}</h3>  
          <div 
          cdkDropList           
          [cdkDropListData]="tasksGroupedByStatus()[status]"
          (cdkDropListDropped)="drop($event, status)"
           class="task-list">             

          @for(task of getTasksByStatus(status); track task.id ){
           <div class="card" cdkDrag>
            <h4>{{ task.title }}</h4>
            <p>{{ task.description }}</p>
            <p>{{ task.assignee }}</p>
            <!-- @if(task.assignee){               -->
            <!-- <small >担当: {{ task.assignee }}</small> -->
             <!-- } -->
             <div *cdkDragPlaceholder class="custom-placeholder">In Here</div>
           </div>
          }
         </div>        
      </div> 
     }
    </div>
  <!-- } -->
