<div class="board-container">
      
     @if( tasksSignal().length >0 ){     
      <div class="kanban-board" >  
       
        <div class="toolbar">
        
        <label>

          <input type="checkbox" 

            [checked]="onlyMyTasks()" 

            (change)="toggleFilter($event)" />

          自分のみ表示

        </label>

      </div>        
      
         @for(status of statuses; track status){

         <div class="column" >

          <h3>{{ status | uppercase }}</h3>   

          @for(task of getTasksByStatus(status); track task.id ){

           <div class="card" >

            <h4>{{ task.title }}</h4>

            <p>{{ task.description }}</p>

            @if(task.assignee){
              
            <small >担当: {{ task.assignee }}</small>
            }
           </div>
          }
        </div>
         }  
      </div>
      }    
</div>
